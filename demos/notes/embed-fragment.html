<div class="notes-native-demo" data-notes-native-demo>
  <div class="notes-native-windows">
    <div class="notes-native-panel">
      <iframe src="demos/notes/panel.html" data-app-demo data-notes-frame="panel" title="便签与待办真实界面演示" width="380" height="520" loading="eager"></iframe>
      <button type="button" data-notes-reopen-panel hidden>重新打开便签与待办</button>
    </div>
    <div class="notes-native-desktop">
      <iframe src="demos/notes/desktop.html" data-app-demo data-notes-frame="desktop" title="桌面便签真实界面演示" width="300" height="220" loading="eager"></iframe>
      <button type="button" data-notes-reopen-note hidden>重新打开桌面便签</button>
    </div>
  </div>
  <div class="notes-native-actions"><button type="button" data-notes-demo-reminder>体验待办提醒</button><button type="button" data-notes-demo-reset>重置演示</button></div>
  <p data-notes-native-status role="status" aria-live="polite"></p>
</div>
<!-- Load demos/notes/embed.js with defer. Parent demo-embed.js sends theme to data-app-demo iframes. -->
