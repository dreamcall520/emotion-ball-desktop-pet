<!doctype html>
<html lang="zh-CN" data-appearance="light" data-color-mode="standard">
<head>
  <meta charset="utf-8">
  <script src="../../site-protection.js?v=20261007"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; frame-src 'self'; connect-src 'none'; base-uri 'none'; object-src 'none'">
  <title>额度卡片 2.0 · 网页示例</title>
  <link rel="stylesheet" href="demo.css?v=20261007-v0404">
  <script defer src="demo.js?v=20261007-v0404"></script>
  <link rel="icon" href="../../assets/huancai-icon.png">
</head>
<body>
  <main>
    <div class="demo-toolbar">
      <div class="demo-period-switch" id="demo-card-period" role="group" aria-label="额度卡片样式"><button type="button" data-card-period="dual" aria-pressed="true">双周期</button><button type="button" data-card-period="5h" aria-pressed="false">5 小时</button><button type="button" data-card-period="week" aria-pressed="false">周额度</button></div>
      <button class="demo-back" id="api-back" type="button" hidden>‹ 返回额度趋势</button>
      <label>用量示例 <select id="demo-scenario" data-focus-mode="keyboard"><option value="balanced">节奏均衡</option><option value="fast">用量偏快</option><option value="unknown">记录不足</option></select></label>
    </div>
    <div class="demo-layout">
      <div class="demo-cards">
        <section aria-label="套餐额度与状态"><div class="demo-card-window"><iframe id="quota-frame" src="quota-label.html?v=20261007-v0404" title="可操作的真实额度卡片" width="196" height="144"></iframe></div></section>
        <section aria-label="独立 API 费用"><div class="demo-card-window"><iframe id="api-label-frame" src="api-usage-label.html?v=20261007-v0404" title="可操作的真实 API 费用卡片" width="196" height="92"></iframe></div></section>
      </div>
      <div class="demo-detail"><iframe id="detail-frame" src="codex-details.html?v=20261007-v0404" title="额度趋势与详情" height="400"></iframe><div id="api-report" hidden><iframe id="api-report-frame" src="api-usage.html?v=20261007-v0404" title="API 费用与用量示例报告" height="620"></iframe></div></div>
    </div>
    <aside id="demo-thread" role="dialog" aria-modal="false" aria-labelledby="demo-thread-title" hidden><header><h2 id="demo-thread-title" tabindex="-1">Codex 会话 · 示例</h2><button id="thread-close" type="button" aria-label="关闭会话示例">×</button></header><p id="thread-title"></p><p id="thread-text"></p></aside>
    <p id="demo-feedback" class="demo-caption" role="status" aria-live="polite" hidden></p>
  </main>
</body>
</html>
