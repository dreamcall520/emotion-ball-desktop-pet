<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>球球 · 喜气羊羊春节皮肤</title>
  <link rel="stylesheet" href="sheep-skin.css">
  <link rel="stylesheet" href="sheep-preview.css">
  <script src="lib/sheep-theme.js" defer></script>
  <script src="lib/sheep-fireworks.js" defer></script>
  <script src="lib/sheep-skin.js" defer></script>
  <script src="sheep-preview.js" defer></script>
</head>
<body data-theme="light">
  <main class="preview-shell">
    <header class="page-header">
      <a class="wordmark" href="#preview" aria-label="球球羊年春节皮肤预览"><span class="wordmark-dot"></span>球球 <span class="wordmark-divider">/</span> 新春衣橱</a>
      <span class="candidate-tag">造型 v2 · 尚未安装</span>
    </header>

    <section class="preview-layout" id="preview" aria-labelledby="page-title">
      <div class="pet-panel">
        <div class="pet-intro">
          <p class="eyebrow">YEAR OF THE SHEEP</p>
          <h1 id="page-title">喜气<span>羊羊</span></h1>
          <p class="subtitle">把一身软乎乎，和一整年的好彩头送给你。</p>
        </div>

        <div class="pet-stage">
          <span class="stage-flower flower-one" aria-hidden="true">✳</span>
          <span class="stage-flower flower-two" aria-hidden="true">✳</span>
          <div class="dialogue" role="status" aria-live="polite" aria-atomic="true">
            <span class="dialogue-label" id="dialogue-label">羊羊拜年</span>
            <span id="dialogue-text">新年好呀！把今年第一份好心情送给你，咩～</span>
          </div>
          <button class="pet-touch" id="main-pet" type="button" aria-label="摸摸羊羊的头，触发摸头蹭蹭"></button>
          <div class="stage-shadow" aria-hidden="true"></div>
          <span class="stage-seal" aria-hidden="true">春<br>来</span>
        </div>

        <div class="stage-toolbar">
          <span class="follow-hint"><span></span>眼神会跟着你的鼠标走 · 点羊羊摸摸头</span>
          <div class="view-controls" aria-label="预览设置">
            <button id="theme-toggle" type="button" aria-pressed="false">切换深底</button>
            <button id="pause-toggle" type="button" aria-pressed="false">暂停动画</button>
          </div>
        </div>
      </div>

      <aside class="interaction-panel" aria-labelledby="interaction-title">
        <div class="section-heading"><span class="section-number">01</span><h2 id="interaction-title">和羊羊过个年</h2></div>
        <p class="section-description">点一份年味，收一句专属回应。</p>
        <div class="action-grid" id="action-grid"></div>
        <div class="design-note"><span aria-hidden="true">✽</span><p>灵感来自<strong>春野第八弹 · 春节主题包</strong>的小羊。收敛卷毛细节，保留温柔神态；短前蹄贴近身体，后蹄稳稳承托。</p></div>
      </aside>
    </section>

    <section class="size-section" aria-labelledby="size-title">
      <div class="size-intro"><div class="section-heading"><span class="section-number">02</span><h2 id="size-title">落在桌面上，刚刚好</h2></div><p>按标注的 CSS 像素尺寸展示，可查看缩小后的辨识度。</p></div>
      <div class="size-grid" id="size-grid"></div>
    </section>
    <footer class="page-footer"><span>球球 · 羊年春节限定皮肤</span><span>外观与动作候选，等待你的审阅</span></footer>
  </main>
</body>
</html>
