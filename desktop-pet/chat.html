<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>和球球聊聊</title>
  <link rel="stylesheet" href="chat.css">
  <script defer src="chat-renderer.js"></script>
</head>
<body>
  <main class="chat-panel" aria-label="和球球聊聊">
    <header class="chat-header">
      <span class="pet-mark" aria-hidden="true"><i></i><i></i></span>
      <div class="heading">
        <h1>和球球聊聊</h1>
        <p id="connection-status" role="status">想说什么，我在听</p>
      </div>
      <button id="chat-history" class="text-button" type="button" aria-controls="history-view" aria-expanded="false" title="查看和球球的聊天记录">聊天记录</button>
      <button id="close-chat" class="close-button" type="button" aria-label="关闭聊天" title="关闭聊天（Esc）">×</button>
    </header>

    <section id="conversation" class="conversation" aria-label="聊天内容">
      <div id="empty-state" class="empty-state">
        <span class="empty-dot" aria-hidden="true"></span>
        <h2>我在，想聊点什么？</h2>
        <p>使用本机已登录的 Codex 账号。<br>首次发送才创建聊天，之后接着聊。</p>
      </div>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
    </section>

    <section id="history-view" class="history-view" aria-label="聊天记录" hidden>
      <div class="history-heading">
        <div><h2>聊天记录</h2><p>找到之前的聊天，接着说。</p></div>
        <button id="history-back" class="text-button" type="button">返回聊天</button>
      </div>
      <div id="history-browse" class="history-browse">
        <div id="history-list" class="history-list" aria-label="和球球的历史聊天"></div>
        <p id="history-empty" class="history-empty">还没有聊天记录。<br>发送第一句话后，会保存在这里。</p>
        <div class="history-footer">
          <button id="new-chat" class="new-chat-button" type="button"><span aria-hidden="true">＋</span> 新聊天</button>
          <p id="history-hint">原来的聊天会保留，随时可以切回来。</p>
        </div>
      </div>
      <div id="new-chat-confirmation" class="new-chat-confirmation" role="dialog" aria-labelledby="new-chat-title" aria-describedby="new-chat-description" hidden>
        <h3 id="new-chat-title">开始一段新聊天？</h3>
        <p id="new-chat-description">现在的聊天会保留在记录里。<br>发送第一句话时，才会创建新聊天。</p>
        <div class="confirmation-actions">
          <button id="cancel-new-chat" class="cancel-button" type="button">取消</button>
          <button id="confirm-new-chat" class="confirm-button" type="button">开始新聊天</button>
        </div>
      </div>
    </section>

    <div id="error-banner" class="error-banner" role="alert" hidden>
      <p id="error-text"></p>
      <button id="retry-message" type="button" class="text-button" hidden>重新编辑</button>
    </div>

    <form id="composer" class="composer">
      <label class="sr-only" for="message-input">给球球的消息</label>
      <textarea id="message-input" rows="2" maxlength="2000" placeholder="和球球说句话…" aria-describedby="input-hint" spellcheck="false"></textarea>
      <div class="composer-tools">
        <span id="input-hint">Shift + Enter 换行</span>
        <span id="character-count" hidden>0 / 2000</span>
        <button id="stop-message" class="stop-button" type="button" hidden><span aria-hidden="true">■</span> 停止</button>
        <button id="send-message" class="send-button" type="submit" disabled>发送 <span aria-hidden="true">↑</span></button>
      </div>
    </form>
    <p id="privacy-note" class="privacy-note">使用 Codex 额度 · 延续同一段聊天</p>
  </main>
</body>
</html>
