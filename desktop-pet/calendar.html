<!doctype html>
<html lang="zh-CN" data-ui-window="calendar"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>球球日历</title>
<link rel="stylesheet" href="calendar.css"><link rel="stylesheet" href="ui-theme-blue.css"><link rel="stylesheet" href="color-mode.css"><link rel="stylesheet" href="ui-theme-purple.css">
<script defer src="color-mode.js"></script><script defer src="lib/calendar-model.js"></script><script defer src="calendar-views.js"></script><script defer src="calendar-renderer.js"></script>
</head><body data-mode="desktop">
<svg class="symbols" aria-hidden="true"><defs>
  <!-- Shared Lucide geometry; ISC, see LICENSE-lucide. -->
  <symbol id="cal-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h.01M12 15h.01M16 15h.01M8 18h.01M12 18h.01"/></symbol>
  <symbol id="cal-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="cal-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
  <symbol id="cal-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
  <symbol id="cal-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="cal-corners-square" viewBox="0 0 24 24"><path d="M5 11V5h6M13 19h6v-6"/></symbol>
  <symbol id="cal-corners-rounded" viewBox="0 0 24 24"><path d="M5 11V9a4 4 0 0 1 4-4h2M13 19h2a4 4 0 0 0 4-4v-2"/></symbol>
  <symbol id="cal-pin" viewBox="0 0 24 24"><path d="M8 3h8M9 3v6l-3 4v2h12v-2l-3-4V3ZM12 15v6"/></symbol>
  <symbol id="cal-settings" viewBox="0 0 24 24"><path d="M4 6h7m4 0h5M4 12h3m4 0h9M4 18h11m4 0h1M11 3v6M7 9v6M15 15v6"/></symbol>
  <symbol id="cal-widgets" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="cal-expand" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M14 9v11M7 13h3M7 16h3"/></symbol>
  <symbol id="cal-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.5 6M20 4v7h-7"/></symbol>
  <symbol id="cal-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="cal-todos" viewBox="0 0 24 24"><path d="m3 6 2 2 4-4M12 6h9M3 13l2 2 4-4M12 13h9M3 20l2 2 4-4M12 20h9"/></symbol>
  <symbol id="cal-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="cal-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4M12 2V1"/></symbol>
  <symbol id="cal-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="cal-weather" viewBox="0 0 24 24"><path d="M8 3V1M3.7 4.7 2.3 3.3M2 9H0m3.7 4.3-1.4 1.4M14.3 4.7l1.4-1.4M10.8 5.3A4 4 0 0 0 5.3 11M8 20a4 4 0 1 1 1.7-7.6A5 5 0 1 1 18 20Z"/></symbol>
</defs></svg>
<svg class="menu-pointer" viewBox="0 0 28 12" aria-hidden="true"><path class="menu-pointer-fill" d="M0 12C5 12 7 8 11.7 3.3Q14 1 16.3 3.3C21 8 23 12 28 12V14H0Z"/><path class="menu-pointer-edge" d="M0 12C5 12 7 8 11.7 3.3Q14 1 16.3 3.3C21 8 23 12 28 12"/></svg>
<main id="calendar-shell" class="calendar-shell" aria-label="球球日历">
  <header class="panel-header"><h1><svg aria-hidden="true"><use href="#cal-calendar"/></svg>球球日历</h1><nav id="view-switch" class="calendar-view-switch" aria-label="日历视图"><button type="button" data-action="calendar-view" data-value="day" aria-pressed="false">日</button><button type="button" data-action="calendar-view" data-value="week" aria-pressed="false">周</button><button type="button" data-action="calendar-view" data-value="month" aria-pressed="true">月</button><button type="button" data-action="calendar-view" data-value="year" aria-pressed="false">年</button></nav><div class="header-actions">
    <button id="refresh" class="icon-button" type="button" aria-label="刷新系统日程和待办" title="刷新系统日程和待办"><svg aria-hidden="true"><use href="#cal-refresh"/></svg></button>
    <button id="widget-manager-open" class="icon-button" type="button" aria-label="桌面小组件" title="桌面小组件"><svg aria-hidden="true"><use href="#cal-widgets"/></svg></button>
    <button id="desktop-open" class="icon-button" type="button" aria-label="在桌面打开完整日历" title="在桌面打开完整日历" hidden><svg aria-hidden="true"><use href="#cal-expand"/></svg></button>
    <button id="pin" class="icon-button" type="button" aria-label="窗口置顶" title="窗口置顶" aria-pressed="false"><svg aria-hidden="true"><use href="#cal-pin"/></svg></button>
    <button id="settings-open" class="icon-button" type="button" aria-label="日历设置" title="日历设置"><svg aria-hidden="true"><use href="#cal-settings"/></svg></button>
    <button id="close" class="icon-button" type="button" aria-label="关闭日历" title="关闭日历"><svg aria-hidden="true"><use href="#cal-close"/></svg></button>
  </div></header>
  <p id="global-error" class="error-banner" role="alert" hidden></p>
  <div class="calendar-content">
    <section class="calendar-main" aria-label="月历">
      <div class="month-toolbar"><div class="month-navigation"><button id="previous-month" class="icon-button" aria-label="上一月" title="上一月"><svg aria-hidden="true"><use href="#cal-left"/></svg></button><button id="month-title" class="month-title" type="button" aria-label="选择年月" aria-haspopup="dialog"></button><button id="next-month" class="icon-button" aria-label="下一月" title="下一月"><svg aria-hidden="true"><use href="#cal-right"/></svg></button></div><div class="month-toolbar-actions"><button id="month-corners" class="icon-button" type="button" aria-label="切换为圆角日格" title="切换为圆角日格" aria-pressed="false" hidden><svg aria-hidden="true"><use href="#cal-corners-square"/></svg></button><button id="today" class="text-button" type="button">今天</button></div></div>
      <div id="weekdays" class="weekdays" aria-hidden="true"></div>
      <div id="days" class="month-grid" role="group" aria-label="月份日期"></div>
      <div id="calendar-detail-view" class="view-content" hidden></div>
    </section>
    <aside class="calendar-side" aria-label="所选日期详情">
      <section class="date-summary"><span id="date-context" class="eyebrow"></span><h2 id="selected-title"></h2><p id="selected-lunar"></p></section>
      <button id="weather" class="weather-card" type="button" aria-label="查看今日天气"><span class="weather-top"><span>今日天气</span><span id="weather-city"></span></span><span class="weather-main"><svg class="weather-illustration" viewBox="0 0 24 24" aria-hidden="true"><g class="weather-rays"><path d="M8 3V1M3.7 4.7 2.3 3.3M2 9H0m3.7 4.3-1.4 1.4M14.3 4.7l1.4-1.4"/></g><path d="M10.8 5.3A4 4 0 0 0 5.3 11"/><path class="weather-cloud" d="M8 20a4 4 0 1 1 1.7-7.6A5 5 0 1 1 18 20Z"/></svg><strong id="weather-temperature"></strong><span class="weather-copy"><span id="weather-condition"></span><small id="weather-feels"></small></span></span></button>
      <section class="detail-section"><div class="section-heading"><h3><svg aria-hidden="true"><use href="#cal-clock"/></svg><span id="schedule-title">今日日程</span></h3><span id="schedule-count" class="count-badge"></span></div><div id="connection-status" class="connection-status" hidden></div><div id="events"></div><button id="events-more" class="text-button more-button" type="button" hidden></button><p id="events-truncated" class="subtle-notice" hidden>事项较多，可在系统日历查看全部。</p></section>
      <section id="todos-section" class="detail-section todo-section"><div class="section-heading"><h3><svg aria-hidden="true"><use href="#cal-todos"/></svg><span id="todos-title">今日待办</span></h3><div class="heading-actions"><span id="todo-count" class="count-badge"></span><button id="new-todo" class="icon-button" type="button" aria-label="新建待办" title="新建待办"><svg aria-hidden="true"><use href="#cal-plus"/></svg></button></div></div><p id="notes-error" class="inline-error" role="alert" hidden></p><div id="todos"></div><button id="todos-more" class="text-button more-button" type="button" hidden></button><details id="completed-group" class="completed-group" hidden><summary id="completed-summary"></summary><div id="completed"></div></details></section>
    </aside>
  </div>
</main>
<section id="widget-surface" class="widget-surface" aria-label="桌面日历组件" hidden><div class="widget-drag-area" aria-hidden="true"></div><div class="widget-controls"><button id="widget-settings" class="icon-button" type="button" aria-label="管理桌面小组件" title="管理桌面小组件"><svg aria-hidden="true"><use href="#cal-widgets"/></svg></button><button id="widget-pin" class="icon-button" type="button" aria-label="组件置顶" title="组件置顶" aria-pressed="false"><svg aria-hidden="true"><use href="#cal-pin"/></svg></button><button id="widget-close" class="icon-button" type="button" aria-label="关闭此组件" title="关闭此组件"><svg aria-hidden="true"><use href="#cal-close"/></svg></button></div><div id="widget-body"></div></section>
<p id="boot-status" class="boot-status" role="status">正在打开日历…</p>
<dialog id="todo-dialog" class="todo-dialog" aria-labelledby="todo-dialog-title"><form id="todo-form"><header class="dialog-header"><h2 id="todo-dialog-title">新建待办</h2><button class="icon-button" type="button" data-close-dialog="todo-dialog" aria-label="关闭新建待办"><svg aria-hidden="true"><use href="#cal-close"/></svg></button></header><label class="field">待办内容<textarea id="todo-title" rows="4" maxlength="200" placeholder="写下一件事" required></textarea></label><div class="field"><label id="todo-date-label" for="todo-date-trigger">截止日期</label><input id="todo-date" type="hidden"><button id="todo-date-trigger" class="todo-date-trigger" type="button" aria-labelledby="todo-date-label todo-date-value" aria-haspopup="dialog" aria-controls="date-picker" aria-expanded="false"><span id="todo-date-value"></span><svg aria-hidden="true"><use href="#cal-calendar"/></svg></button></div><p id="todo-error" class="inline-error" role="alert"></p><footer class="dialog-footer"><button class="secondary" type="button" data-close-dialog="todo-dialog">取消</button><button id="todo-save" class="primary" type="submit" disabled>添加待办</button></footer></form><div id="date-picker" class="date-picker" popover="manual" role="dialog" aria-label="选择截止日期"><header class="date-picker-header"><button id="date-picker-previous" class="icon-button" type="button" aria-label="上一月"><svg aria-hidden="true"><use href="#cal-left"/></svg></button><strong id="date-picker-title" aria-live="polite"></strong><button id="date-picker-next" class="icon-button" type="button" aria-label="下一月"><svg aria-hidden="true"><use href="#cal-right"/></svg></button></header><div id="date-picker-week" class="date-picker-week" aria-hidden="true"></div><div id="date-picker-grid" class="date-picker-grid" aria-label="选择日期"></div><footer class="date-picker-footer"><button id="date-picker-clear" class="text-button" type="button">清除</button><button id="date-picker-today" class="text-button" type="button">今天</button></footer></div></dialog>
<dialog id="month-dialog" class="month-dialog" aria-labelledby="month-dialog-title"><form id="month-form"><header class="dialog-header"><h2 id="month-dialog-title">选择年月</h2><button class="icon-button" type="button" data-close-dialog="month-dialog" aria-label="关闭年月选择"><svg aria-hidden="true"><use href="#cal-close"/></svg></button></header><input id="month-input" type="hidden"><div class="month-picker-year"><button id="month-year-previous" class="icon-button" type="button" aria-label="上一年"><svg aria-hidden="true"><use href="#cal-left"/></svg></button><label><input id="month-year" type="text" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="年份，1970到2100"><span>年</span></label><button id="month-year-next" class="icon-button" type="button" aria-label="下一年"><svg aria-hidden="true"><use href="#cal-right"/></svg></button></div><div id="month-picker-grid" class="month-picker-grid" role="group" aria-label="选择月份"></div><p id="month-picker-error" class="inline-error" role="alert" hidden></p><footer class="dialog-footer"><button id="month-picker-current" class="text-button" type="button">本月</button><button class="secondary" type="button" data-close-dialog="month-dialog">取消</button><button id="month-picker-go" class="primary" type="submit">前往</button></footer></form></dialog>
<dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-dialog-title"><header class="dialog-header"><h2 id="settings-dialog-title">日历设置</h2><button class="icon-button" type="button" data-close-dialog="settings-dialog" aria-label="关闭日历设置"><svg aria-hidden="true"><use href="#cal-close"/></svg></button></header><nav id="settings-tabs" class="settings-tabs" role="tablist" aria-label="日历设置分类"><button id="settings-tab-display" class="settings-tab" type="button" role="tab" data-settings-tab="display" aria-controls="settings-panel-display" aria-selected="true" tabindex="0">显示与窗口</button><button id="settings-tab-sources" class="settings-tab" type="button" role="tab" data-settings-tab="sources" aria-controls="settings-panel-sources" aria-selected="false" tabindex="-1">日历来源</button><button id="settings-tab-reminders" class="settings-tab" type="button" role="tab" data-settings-tab="reminders" aria-controls="settings-panel-reminders" aria-selected="false" tabindex="-1">球球互动</button></nav><div class="dialog-scroll"><section id="settings-panel-display" class="settings-tab-panel" data-settings-panel="display" role="tabpanel" aria-labelledby="settings-tab-display"><fieldset><legend>菜单栏</legend><div class="settings-group"><label class="settings-row"><span>常驻菜单栏</span><input id="setting-menu" class="switch" type="checkbox" role="switch" data-preference="menuEnabled"></label><label class="settings-row"><span>显示日期</span><input id="setting-menu-date" class="switch" type="checkbox" role="switch" data-preference="menuDate"></label><div id="menu-date-options" class="menu-date-options" role="group" aria-label="菜单栏日期内容" hidden><label class="settings-row"><span>显示阳历</span><input id="setting-menu-solar" class="source-checkbox" type="checkbox" data-preference="menuDateSolar" aria-describedby="menu-date-note"></label><label class="settings-row"><span>显示农历</span><input id="setting-menu-lunar" class="source-checkbox" type="checkbox" data-preference="menuDateLunar" aria-describedby="menu-date-note"></label><label class="settings-row"><span>显示星期几</span><input id="setting-menu-weekday" class="source-checkbox" type="checkbox" data-preference="menuDateWeekday" aria-describedby="menu-date-note"></label><span id="menu-date-note" class="sr-only">至少保留一种日期格式</span></div></div></fieldset><fieldset><legend>显示</legend><div class="settings-group"><label class="settings-row"><span>农历</span><input id="setting-lunar" class="switch" type="checkbox" role="switch" data-preference="lunar"></label><label class="settings-row"><span>今日天气</span><input id="setting-weather" class="switch" type="checkbox" role="switch" data-preference="weather"></label><label class="settings-row"><span>球球待办</span><input id="setting-todos" class="switch" type="checkbox" role="switch" data-preference="showTodos"></label><label class="settings-row"><span>周起始日</span><select id="setting-week" data-preference="weekStart"><option value="system">跟随系统</option><option value="monday">周一</option><option value="sunday">周日</option></select></label></div></fieldset><fieldset><legend>窗口</legend><div class="settings-group"><label class="settings-row"><span>始终置顶</span><input id="setting-pin" class="switch" type="checkbox" role="switch"></label><button id="settings-widgets" class="settings-row row-button" type="button"><span>桌面小组件</span><svg aria-hidden="true"><use href="#cal-right"/></svg></button></div></fieldset></section><section id="settings-panel-sources" class="settings-tab-panel" data-settings-panel="sources" role="tabpanel" aria-labelledby="settings-tab-sources" hidden><fieldset><legend>系统日历</legend><div class="settings-group"><label class="settings-row"><span>显示系统日历</span><input id="setting-system" class="switch" type="checkbox" role="switch" data-preference="showSystemCalendar"></label></div><div id="settings-connection" class="connection-status"></div><div id="calendar-sources" class="settings-group sources-group" aria-label="显示的日历来源"></div></fieldset></section><section id="settings-panel-reminders" class="settings-tab-panel" data-settings-panel="reminders" role="tabpanel" aria-labelledby="settings-tab-reminders" hidden><fieldset><legend>球球互动</legend><div class="settings-group"><label class="settings-row"><span>节假日互动提醒</span><input id="setting-holiday" class="switch" type="checkbox" role="switch" data-preference="holidayReminders"></label><div class="settings-row"><span class="holiday-copy">节日和假期开始时，每天最多问候一次</span><button id="holiday-preview" class="text-button" type="button">预览互动</button></div></div></fieldset><fieldset><legend>早中晚互动</legend><div class="settings-group">
    <label class="settings-row"><span>定时问候与提醒</span><input id="setting-time-reminders" class="switch" type="checkbox" role="switch" data-preference="timeReminders"></label>
    <label class="settings-row"><span>仅周一至周五提醒</span><input id="setting-reminder-weekdays" class="switch" type="checkbox" role="switch" data-preference="reminderWeekdaysOnly"></label>
    <div class="settings-row"><label for="morning-time">早安问候</label><div class="reminder-controls"><button id="morning-time" class="reminder-time-trigger" type="button" data-time-preference="morningTime" aria-label="早安问候时间" aria-haspopup="dialog" aria-controls="time-picker" aria-expanded="false"><span class="time-value"></span><svg aria-hidden="true"><use href="#cal-clock"/></svg></button><button class="text-button" type="button" data-action="time-preview" data-value="morning" aria-label="预览早安问候">预览</button></div></div>
    <div class="settings-row"><label for="lunch-time">午餐提醒</label><div class="reminder-controls"><button id="lunch-time" class="reminder-time-trigger" type="button" data-time-preference="lunchTime" aria-label="午餐提醒时间" aria-haspopup="dialog" aria-controls="time-picker" aria-expanded="false"><span class="time-value"></span><svg aria-hidden="true"><use href="#cal-clock"/></svg></button><button class="text-button" type="button" data-action="time-preview" data-value="lunch" aria-label="预览午餐提醒">预览</button></div></div>
    <div class="settings-row"><label for="rest-time">午间休息</label><div class="reminder-controls"><button id="rest-time" class="reminder-time-trigger" type="button" data-time-preference="restTime" aria-label="午间休息时间" aria-haspopup="dialog" aria-controls="time-picker" aria-expanded="false"><span class="time-value"></span><svg aria-hidden="true"><use href="#cal-clock"/></svg></button><button class="text-button" type="button" data-action="time-preview" data-value="rest" aria-label="预览午间休息">预览</button></div></div>
    <div class="settings-row"><label for="off-work-time">下班提醒</label><div class="reminder-controls"><button id="off-work-time" class="reminder-time-trigger" type="button" data-time-preference="offWorkTime" aria-label="下班提醒时间" aria-haspopup="dialog" aria-controls="time-picker" aria-expanded="false"><span class="time-value"></span><svg aria-hidden="true"><use href="#cal-clock"/></svg></button><button class="text-button" type="button" data-action="time-preview" data-value="offWork" aria-label="预览下班提醒">预览</button></div></div>
  </div><p class="reminder-note">每类当天提醒一次，错过后不集中补发。</p></fieldset></section></div><p id="settings-feedback" class="inline-feedback" role="status" aria-live="polite" hidden></p><footer class="dialog-footer"><button class="primary" type="button" data-close-dialog="settings-dialog">完成</button></footer><div id="time-picker" class="time-picker" popover="manual" role="dialog" aria-labelledby="time-picker-title"><header class="time-picker-header"><h3 id="time-picker-title">设置时间</h3></header><div class="time-picker-fields"><label>小时<input id="time-hour" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="小时，0到23"></label><span aria-hidden="true">:</span><label>分钟<input id="time-minute" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="分钟，0到59"></label></div><p id="time-picker-error" class="inline-error" role="alert" hidden></p><footer class="time-picker-footer"><button id="time-picker-cancel" class="secondary" type="button">取消</button><button id="time-picker-save" class="primary" type="button">确定</button></footer></div></dialog>
<dialog id="widgets-dialog" class="widgets-dialog" aria-labelledby="widgets-dialog-title"><header class="dialog-header"><h2 id="widgets-dialog-title">桌面小组件</h2><button class="icon-button" type="button" data-close-dialog="widgets-dialog" aria-label="关闭组件管理"><svg aria-hidden="true"><use href="#cal-close"/></svg></button></header><div id="widget-options" class="dialog-scroll widget-options"></div><p id="widget-error" class="inline-error" role="alert"></p><footer class="dialog-footer"><button class="primary" type="button" data-close-dialog="widgets-dialog">完成</button></footer></dialog>
<div id="calendar-tooltip" role="tooltip" hidden></div>
<div id="item-preview" class="item-preview" popover="auto" role="dialog" aria-label="事项预览"></div>
</body></html>
