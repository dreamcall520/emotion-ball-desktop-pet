<!doctype html><html lang="zh-CN" data-appearance="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>WorkBuddy 消耗趋势</title><link rel="stylesheet" href="color-mode.css"><link rel="stylesheet" href="codex-details.css"></head><body><section id="details-panel" aria-label="WorkBuddy 消耗趋势"><header class="panel-header"><h1 id="details-title">消耗趋势<small class="title-product">WorkBuddy</small></h1><nav class="panel-tools"><button id="details-close" type="button" aria-label="关闭详情">×</button></nav></header><main id="details-content" aria-live="polite"><div id="quota-view"><div class="trend-stats"><p><span>可用积分</span><strong id="balance">—</strong></p><p><span id="change-label">今日消耗</span><strong id="change" class="time-value">—</strong></p></div><div class="chart-block"><div class="chart-meta"><div class="chart-view-switch" role="tablist"><button id="view-records" type="button" role="tab" aria-selected="true">走势</button><button id="view-daily" type="button" role="tab" aria-selected="false">每日消耗</button></div><div class="chart-actions"><div class="trend-tabs"><button id="today" type="button" aria-pressed="true">今日</button><button id="week" type="button" aria-pressed="false">近7天</button></div><span id="updated" class="chart-status"></span><details id="explanation" class="chart-help"><summary aria-label="消耗数据说明">ⓘ</summary><div class="chart-help-body">按官方逐请求积分记录统计，通常延迟2–3小时；今日数据截至上次查询。走势按日累计，未成功取得记录时不以余额变化补算。</div></details></div></div><div id="chart"><div id="usage-plot"></div><div id="usage-empty" class="empty-state"><strong id="hint">消耗统计暂不可用</strong><p id="unavailable-note">暂未取得 WorkBuddy 官方消耗记录</p></div></div></div><p id="usage-caption" class="panel-note" hidden></p><p id="balance-note" class="panel-note" hidden></p><footer class="panel-note"><span id="
