<!doctype html><html lang="zh-CN" data-appearance="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>WorkBuddy 积分变化</title><link rel="stylesheet" href="color-mode.css"><link rel="stylesheet" href="codex-details.css"></head><body><section id="details-panel" aria-label="WorkBuddy 积分变化"><header class="panel-header"><h1 id="details-title">积分变化<small class="title-product">WorkBuddy</small></h1><nav class="panel-tools"><button id="details-close" type="button" aria-label="关闭详情">×</button></nav></header><main id="details-content" aria-live="polite"><div id="quota-view"><div class="chart-meta"><div class="trend-tabs"><button id="view-records" type="button" aria-pressed="true">变化记录</button><button id="view-daily" type="button" aria-pressed="false">每日变化</button></div></div><div class="chart-meta"><div class="trend-tabs"><button id="today" type="button" aria-pressed="true">今日</button><button id="week" type="button" aria-pressed="false">近7天</button></div></div><div class="trend-stats"><p><span>可用积分</span><strong id="balance">—</strong></p><p><span id="change-label">今日减少</span><strong id="change" class="time-value">—</strong></p></div><div id="chart"></div><div id="events"></div><p id="hint" class="panel-note"></p><div class="forecast-note"><span class="forecast-symbol" aria-hidden="true">◷</span><div class="forecast-copy"><b id="forecast">还不能估算可用天数</b><p id="expiry-note"></p><p id="refresh-note"></p></div></div><details id="explanation" class="panel-note"><summary>ⓘ 如何理解这些记录</summary><p>增加与减少按相邻真实查询计算，没有记录的时段不补数。奖励增加与已知到期单独标注；原因不明确的下降只叫观察到减少，不当作消费流水。曲线只连接真实查询，虚线为超过10分钟的记录间隔。仅当连续记录跨至少24小时、多次下降且没有到期、刷新或增长混杂时，按余额下降速度粗估天数；不代表确认消费。</p></details></div><section id="task-view" hidden></section></main></section><script src="quota-trend-curve.js"></script><script src="workbuddy-tasks-renderer.js"></script><script src="workbuddy-details-renderer.js"></script></body></html>
