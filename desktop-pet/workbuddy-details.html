<!doctype html><html lang="zh-CN" data-appearance="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>WorkBuddy 消耗趋势</title><link rel="stylesheet" href="color-mode.css"><link rel="stylesheet" href="codex-details.css"><link rel="stylesheet" href="workbuddy-details.css">  <link rel="stylesheet" href="ui-theme-purple.css">
</head><body><section id="details-panel" aria-label="WorkBuddy 消耗趋势"><header class="panel-header"><h1 id="details-title">消耗趋势<small class="title-product">WorkBuddy</small></h1><nav class="panel-tools"><button id="details-close" type="button" aria-label="关闭详情">×</button></nav></header><main id="details-content" aria-live="polite"><div id="quota-view"><div class="trend-stats"><p><span id="balance-label">可用积分</span><strong id="balance">—</strong></p><p><span id="change-label">今日消耗</span><strong id="change" class="time-value">—</strong></p></div><div class="chart-block"><div class="chart-meta"><div class="chart-view-switch" role="tablist"><button id="view-records" type="button" role="tab" aria-selected="true">走势</button><button id="view-daily" type="button" role="tab" aria-selected="false">每日消耗</button></div><div class="chart-actions"><div id="period-switch" class="trend-tabs"><button id="today" type="button" aria-pressed="true">今日</button><button id="week" type="button" aria-pressed="false">近7天</button></div><span id="updated" class="chart-status"></span><details id="explanation" class="chart-help"><summary aria-label="消耗数据说明">ⓘ</summary><div class="chart-help-body"><ul><li>统计实际用掉的积分。</li><li>数据可能延迟2–3小时，以更新时间为准。</li><li>今日走势：按使用时间累加积分。</li><li>每日消耗：查看近7天每天用了多少积分。</li><li id="balance-note" hidden></li></ul></div></details></div></div><div id="chart"><div id="usage-plot"></div><div id="usage-empty" class="empty-state"><strong id="hint">消耗统计暂不可用</strong><p id="unavailable-note">暂未取得 WorkBuddy 官方消耗记录</p></div></div></div><footer class="panel-note credit-notes" aria-label="积分有效期与刷新"><span id="refresh-note"></span><span class="credit-note-separator" aria-hidden="true"></span><span id="expiry-block"><span id="expiry-note"></span></span></footer></div><section id="task-view" hidden></section></main></section><script src="quota-trend-curve.js"></script><script src="workbuddy-tasks-renderer.js"></script><script src="workbuddy-details-renderer.js"></script></body></html>
