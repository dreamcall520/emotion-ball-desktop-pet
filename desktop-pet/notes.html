<!doctype html>
<html lang="zh-CN" data-ui-window="notes"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>球球 · 便签与待办</title><link rel="stylesheet" href="notes.css"><link rel="stylesheet" href="color-mode.css">
<link id="blue-style" rel="stylesheet" href="notes-blue.css" disabled><link rel="stylesheet" href="ui-theme-blue.css">
<script defer src="color-mode.js"></script>
<script defer src="lib/notes-model.js"></script><script defer src="notes-renderer.js"></script></head><body>
<div id="storage-alert" class="storage-alert" role="alert" hidden></div>
      <div class="panel" id="panel" hidden>
        <header class="panel-header"><h1>便签与待办</h1><div class="header-actions"><button class="icon-button window-front" id="pin-panel" aria-label="主面板保持在最前" aria-description="仅改变主面板的显示层级，不影响便签排序" aria-pressed="false" title="主面板保持在最前，不影响便签排序">窗口置顶</button><button class="icon-button collapse-button" id="hide-panel" aria-label="关闭主面板" title="关闭主面板"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div></header>
        <div class="list-toolbar"><nav class="tabs" role="tablist" aria-label="记录类型"><button id="notes-tab" title="点击便签标题编辑；关闭桌面便签后，仍可在列表中找到" aria-description="点击便签标题编辑；关闭桌面便签后，仍可在列表中找到" role="tab" aria-controls="records" aria-selected="false">便签</button><button id="todos-tab" title="点击圆圈标记完成；截止日期和提醒可分别设置" aria-description="点击圆圈标记完成；截止日期和提醒可分别设置" class="active" role="tab" aria-controls="records" aria-selected="true">待办</button></nav><span id="progress-text" class="todo-progress" role="status" aria-live="polite" hidden></span><div class="list-controls"><div class="filter-toolbar" role="group" aria-label="筛选记录"><span id="status-filter-control" class="filter-control"><button id="filter" type="button" class="filter-trigger" aria-label="待办分组" aria-expanded="false" aria-controls="filter-menu"><span id="filter-label" class="filter-label"></span><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"></path></svg></button><div id="filter-menu" class="filter-popover" hidden></div></span><span id="category-filter-control" class="filter-control" hidden><button id="category-filter" type="button" class="filter-trigger" aria-label="便签分类" aria-expanded="false" aria-controls="category-menu"><span id="category-filter-label" class="filter-label">分类</span><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button><div id="category-menu" class="filter-popover" hidden></div></span></div><button id="toggle-search" class="icon-button search-toggle" aria-label="展开搜索" aria-expanded="false" aria-controls="search-row" title="搜索 · ⌘/Ctrl K"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"></circle><path d="m15 15 5 5"></path></svg></button><button class="new-button" id="new-button" aria-label="新建待办" title="新建待办"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M13 4H5v16h14v-8M16 3v6m-3-3h6M8 11h4m-4 4h7"></path></svg><span>新建</span></button></div></div>
        <div class="list-tools" id="search-row" hidden><label class="search-box"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"></circle><path d="m15 15 5 5"></path></svg><input id="search" type="search" placeholder="搜索待办" aria-label="搜索标题与内容"></label></div>
        <div class="section-heading" id="group-heading"><div class="group-label"><h2 id="group-title">今天</h2></div></div>
        <p id="list-description" class="list-description"></p>
        <div id="records" class="records" role="tabpanel" aria-labelledby="todos-tab"></div>
        <form id="quick-add" class="quick-add"><svg class="quick-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L20 8a2 2 0 0 0-4-4L5 15Z"></path></svg><textarea id="quick-title" rows="1" placeholder="添加待办，回车保存…" aria-label="新待办标题" title="Enter 保存，Shift + Enter 换行" required></textarea><div class="quick-actions"><div class="quick-properties"><label id="quick-category-picker" class="quick-category-picker" hidden><select id="quick-category-select" aria-label="快速便签分类"></select><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></label><button id="quick-due" type="button" class="quick-option"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14v15H5zM8 3v4m8-4v4M5 10h14"/></svg><span id="quick-due-label">截止日期</span></button><button id="quick-reminder" type="button" class="quick-option"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 17h12l-2-3V9a4 4 0 0 0-8 0v5l-2 3Zm4 3h4"/></svg><span id="quick-reminder-label">提醒</span></button></div><button id="quick-save" type="submit" class="send-button" aria-label="添加待办" disabled>添加</button></div></form>
      </div>
      <section id="desktop-note" class="desktop-note" hidden aria-label="独立便签">
        <div id="note-drag" class="note-toolbar" title="拖动顶部空白移动便签"><span class="note-identity"><i aria-hidden="true"></i>便签</span><div class="note-tools"><button id="pin-note" class="icon-button" aria-label="取消置顶" title="取消置顶"><svg aria-hidden="true" viewBox="0 0 24 24" class="pin-svg" preserveAspectRatio="xMidYMid meet"><path d="M8 3h8M9 3v6l-3 4v2h12v-2l-3-4V3ZM12 15v6"></path></svg></button><button id="desktop-more" class="icon-button note-more" aria-label="便签更多操作" title="更多操作"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button><button id="hide-note" class="icon-button collapse-button" aria-label="关闭便签" title="关闭桌面便签，内容保留，可从列表重新打开"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div></div>
        <div class="note-heading"><input id="desktop-title" aria-label="便签标题" placeholder="无标题便签"></div>
        <textarea id="desktop-body" aria-label="便签正文" placeholder="写下想记住的事…"></textarea>
        <div id="note-footer" class="note-footer" hidden><span id="note-save-status" role="status"></span></div>
      </section>
<section id="reminder" class="reminder-card" aria-label="待办提醒" aria-live="polite" hidden></section>
<div id="toast" class="toast" role="status" hidden></div>
<div id="close-status" class="close-status" role="status" hidden>正在保存并退出…</div>
  <dialog id="organize" aria-labelledby="organize-title"><header class="dialog-header"><h2 id="organize-title">智能整理</h2><button type="button" class="icon-button" id="organize-close" aria-label="关闭智能整理">×</button></header><p class="field-hint">精简措辞、理顺表达、按事项分行，保留原意与关键信息。使用已登录的 Codex 整理这条便签，确认后才替换原文。</p><details id="organize-original" open><summary>原文</summary><pre id="organize-source"></pre></details><section id="organize-result" hidden><label class="field">整理后的标题<input id="organize-result-title" readonly></label><label class="field">整理后的正文<textarea id="organize-result-body" readonly></textarea></label></section><p id="organize-error" class="error-text" role="alert"></p><p id="organize-status" class="field-hint" role="status"></p><footer class="dialog-footer"><button type="button" class="secondary" id="organize-cancel">保留原文</button><button type="button" class="secondary" id="organize-copy" hidden>复制结果</button><button type="button" class="primary" id="organize-generate">开始整理</button><button type="button" class="primary" id="organize-apply" hidden>替换原文</button></footer></dialog>
  <dialog id="editor" class="category-dialog" aria-labelledby="editor-title" aria-describedby="editor-error"><form id="editor-form"><header class="dialog-header"><h2 id="editor-title"></h2><button type="button" class="icon-button" id="editor-close" aria-label="关闭编辑">×</button></header><div id="editor-fields"></div><p id="editor-error" class="error-text" role="alert"></p><footer class="dialog-footer"><button type="button" class="secondary" id="editor-cancel">取消</button><button type="submit" class="primary" id="editor-save">保存</button></footer></form></dialog>
  <dialog id="actions" aria-labelledby="actions-title"><header class="dialog-header"><h2 id="actions-title">更多操作</h2><button type="button" class="icon-button" id="actions-close" aria-label="关闭操作菜单">×</button></header><div id="actions-list" class="actions-list"></div></dialog>
  <dialog id="save-guard" aria-labelledby="save-guard-title"><header class="dialog-header"><h2 id="save-guard-title">修改尚未保存</h2></header><p class="field-hint">保存失败，输入仍在。可以重试，或继续编辑；放弃只会丢弃本次未保存的修改。</p><div class="actions-list"><button id="guard-retry" type="button">重试保存并关闭</button><button id="guard-cancel" type="button">继续编辑</button><button id="guard-discard" type="button" class="danger">放弃本次修改并关闭</button></div></dialog>

<dialog id="category-manager" class="category-dialog" aria-labelledby="category-manager-title"><header class="dialog-header"><h2 id="category-manager-title">管理分类</h2><button id="category-manager-close" type="button" class="icon-button" aria-label="关闭分类管理">×</button></header><div class="category-fixed"><span>未分类</span><span id="uncategorized-count" class="fixed-meta"></span></div><div id="category-list" class="category-list"></div><p id="category-manager-error" class="error-text category-error" role="alert"></p><footer class="dialog-footer"><button id="category-add" type="button" class="category-add">＋ 新增分类</button><button id="category-manager-done" type="button" class="secondary">完成</button></footer></dialog>
<dialog id="new-category" class="category-dialog" aria-labelledby="new-category-title"><form id="new-category-form"><header class="dialog-header"><h2 id="new-category-title">新增分类</h2><button id="new-category-close" type="button" class="icon-button" aria-label="取消新增分类">×</button></header><label class="field">分类名称<input id="new-category-name" placeholder="例如：旅行计划" autocomplete="off"></label><p class="field-hint">最多 20 字，名称不能重复。</p><p id="new-category-error" class="error-text" role="alert"></p><footer class="dialog-footer"><button id="new-category-cancel" type="button" class="secondary">取消</button><button id="new-category-save" type="submit" class="primary">创建分类</button></footer></form></dialog>
<dialog id="move-category" class="category-dialog" aria-labelledby="move-category-title"><form id="move-category-form"><header class="dialog-header"><h2 id="move-category-title">移动到分类</h2><button id="move-category-close" type="button" class="icon-button" aria-label="取消移动便签">×</button></header><p id="move-note-title" class="move-note-title"></p><div id="move-category-list" class="move-list"></div><p id="move-category-error" class="error-text" role="alert"></p><footer class="dialog-footer"><button id="move-category-cancel" type="button" class="secondary">取消</button><button id="move-category-save" type="submit" class="primary">移动</button></footer></form></dialog>
<dialog id="delete-category" class="category-dialog" aria-labelledby="delete-category-title"><header class="dialog-header"><h2 id="delete-category-title">删除分类</h2><button id="delete-category-close" type="button" class="icon-button" aria-label="取消删除分类">×</button></header><p id="delete-category-copy" class="delete-copy"></p><p class="delete-detail">所有便签会移到未分类，正文和回收站状态都会保留。</p><p id="delete-category-error" class="error-text" role="alert"></p><footer class="dialog-footer"><button id="delete-category-cancel" type="button" class="secondary">取消</button><button id="delete-category-confirm" type="button" class="primary delete-confirm">删除分类</button></footer></dialog>
<dialog id="quick-due-dialog" class="category-dialog" aria-labelledby="quick-due-title"><form id="quick-due-form"><header class="dialog-header"><h2 id="quick-due-title">截止日期</h2><button id="quick-due-close" type="button" class="icon-button" aria-label="取消设置截止日期">×</button></header><label class="field">日期<input id="quick-due-date" type="date"></label><div id="quick-due-shortcuts" class="timing-shortcuts"></div><p class="field-hint">截止日期与提醒独立，设置日期不会开启提醒。</p><p id="quick-due-error" class="error-text" role="alert"></p><footer class="dialog-footer"><button id="quick-due-cancel" type="button" class="secondary">取消</button><button type="submit" class="primary">保存</button></footer></form></dialog>
<dialog id="quick-reminder-dialog" class="category-dialog" aria-labelledby="quick-reminder-title"><form id="quick-reminder-form"><header class="dialog-header"><h2 id="quick-reminder-title">设置提醒</h2><button id="quick-reminder-close" type="button" class="icon-button" aria-label="取消设置提醒">×</button></header><div class="date-pair"><label class="field">日期<input id="quick-reminder-date" type="date" required></label><label class="field">时间<input id="quick-reminder-time" type="time" required></label></div><p class="field-hint">提醒需球球保持运行；设置提醒不会改变截止日期。</p><p id="quick-reminder-error" class="error-text" role="alert"></p><footer class="dialog-footer"><button id="quick-reminder-clear" type="button" class="secondary">移除提醒</button><button id="quick-reminder-cancel" type="button" class="secondary">取消</button><button type="submit" class="primary">保存</button></footer></form></dialog>
</body></html>
