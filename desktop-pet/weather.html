<!doctype html><html lang="zh-CN" data-appearance="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>球球天气</title><link rel="stylesheet" href="quota-label.css"><link rel="stylesheet" href="weather.css"><link rel="stylesheet" href="color-mode.css"></head><body><div id="quota-beam"><section id="quota-label" data-size="compact" data-expanded="false"><button id="folded" aria-expanded="false"><span id="summary"><span class="summary-period"><span id="small-icon" class="weather-icon"></span><span>天气</span></span><strong id="small-temperature" class="summary-value">—</strong></span></button><article id="weather-details" hidden><header><button id="city" aria-label="选择天气城市">选择城市 <span>⌄</span></button><button id="collapse" type="button" aria-label="收起天气卡" aria-controls="weather-details" aria-expanded="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 10 4-4 4 4"/></svg></button></header><div class="location-meta"><span id="location-mode">当前位置</span><time id="date"></time></div><section id="weather-empty" hidden><div id="empty-icon" aria-hidden="true"></div><h2 id="empty-title"></h2><p id="empty-message"></p><div class="empty-actions"><button id="empty-retry">重试</button><button id="empty-city">选择城市</button></div></section><div id="weather-content"><div class="current"><div><strong id="temperature">—</strong><p><span id="condition">等待天气数据</span><span id="feels"></span></p></div><div id="hero-icon" class="weather-icon"></div></div><div class="forecast-toolbar"><div class="tabs" role="tablist" aria-label="天气预报时段"><button id="today-tab" role="tab" aria-selected="true" aria-controls="today-panel">今天</button><button id="week-tab" role="tab" aria-selected="false" aria-controls="week-panel">7天</button></div><span id="hourly-hint">24小时 · 每3小时</span><div id="week-layout" hidden role="group" aria-label="七天预报布局"><button data-layout="vertical" aria-pressed="false">竖向</button><button data-layout="horizontal" aria-pressed="true">横向</button></div></div><section id="today-panel" role="tabpanel" aria-labelledby="today-tab"><div id="hours"></div><div id="metrics"></div></section><section id="week-panel" role="tabpanel" aria-labelledby="week-tab" hidden><div id="week-list" hidden></div><div id="week-chart"></div></section><footer><div class="footer-meta"><span id="updated">尚未更新</span><span id="notice" role="status" aria-live="polite" hidden></span></div><div class="footer-actions"><button id="source-toggle" aria-expanded="false" aria-controls="source-details" title="查看完整数据来源">数据来源：Open-Meteo</button><button id="refresh" title="刷新天气"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 5a5 5 0 1 0 1 4M12 2v4H8"/></svg>刷新</button></div></footer><details id="source-details"><summary>数据来源</summary><p>天气：Open-Meteo<br>空气质量：CAMS / Open-Meteo（US AQI）<br>城市：GeoNames<br>图标：Meteocons · Bas Milius（MIT）</p></details></div></article><section id="city-picker" hidden aria-label="选择天气位置"><header><h2>选择城市</h2><button id="close-picker" aria-label="关闭城市选择">✕</button></header><button id="use-location"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m13 3-4 10-2-4-4-2 10-4Z"/></svg>当前位置</button><form id="search-form"><input id="search-input" maxlength="100" placeholder="搜索城市" aria-label="搜索城市"><button type="submit">搜索</button></form><p id="search-status" role="status" aria-live="polite"></p><div id="search-results"></div></section></section></div><script src="color-mode.js"></script><script src="weather-renderer.js"></script></body></html>
