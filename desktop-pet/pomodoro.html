<section hidden class="focus-panel panel" id="focus-panel" data-face="analog" aria-labelledby="panel-title">

="major" x1="100" y1="6" x2="100" y2="17" transform="rotate(270 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(276 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(282 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(288 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(294 100 100)"/><line class="major" x1="100" y1="6" x2="100" y2="17" transform="rotate(300 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(306 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(312 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(318 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(324 100 100)"/><line class="major" x1="100" y1="6" x2="100" y2="17" transform="rotate(330 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(336 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(342 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(348 100 100)"/><line class="minor" x1="100" y1="6" x2="100" y2="11" transform="rotate(354 100 100)"/></g><circle class="clock-base" cx="100" cy="100" r="66"/><path id="clock-sector" class="clock-sector"/><line id="clock-needle" class="clock-needle" x1="100" y1="107" x2="100" y2="23"/><circle class="clock-hub" cx="100" cy="100" r="7"/><circle class="clock-pin" cx="100" cy="100" r="4"/></svg><span id="clock-scale" class="sr-only">60 分钟刻度 · 每格 1 分钟</span></div><div class="dial-content"><span id="phase-label" class="sr-only">准备专注</span><div id="time" class="time" role="timer" aria-label="剩余25分钟"><span id="time-minutes">25</span><span class="time-colon">:</span><span id="time-seconds">00</span></div></div><div class="timeline" aria-hidden="true"><div class="timeline-rail"><i></i><b></b></div><div class="timeline-tic           <div class="timer-actions"><button id="start" class="primary"><svg><use id="start-icon" href="#i-play"/></svg><span id="start-label">开始专注</span></button></div>
          <footer class="panel-footer"><button id="reset" class="reset" aria-label="重新计时" title="重新开始当前倒计时，保留已完成的专注记录"><svg><use href="#i-reset"/></svg><span>重新计时</span></button><span class="today-stats"><span>今日</span> <strong id="today-rounds">0</strong> 次专注 <span class="stat-divider">·</span> <strong id="today-minutes">0</strong> 分钟</span></footer>
          <p id="feedback" class="feedback" role="alert" hidden></p>
          <form id="settings" class="settings" aria-labelledby="settings-title" hidden>
            <div class="settings-head"><h3 id="settings-title">计时设置</h3><button id="settings-close" type="button" class="icon-button" aria-label="关闭设置"><svg><use href="#i-close"/></svg></button></div>
            <div class="settings-body">
              <fieldset id="display-style" class="display-field"><legend>展示样式</legend><div class="display-choices"><label class="style-option"><input type="radio" name="face" value="analog" checked required><span class="choice-card"><span class="choice-sample" aria-hidden="true"><span class="sample-analog"></span></span><span>刻度表盘</span></span></label><label class="style-option"><input type="radio" name="face" value="timeline" required><span class="choice-card"><span class="choice-sample" aria-hidden="true"><span class="sample-timeline">25:00</span></span><span>时间刻度</span></span></label><label class="style-option"><input type="radio" name="face" value="modules" required><span class="choice-card"><span class="choice-sample" aria-hidden="true"><span class="sample-modules"><i>25</i><i>00</i></span></span><span>分秒双屏</span></span></label><label class="style-option"><input type="radio" name="face" value="minutes" required><span class="choice-card"><span class="choice-sample" aria-hidden="true"><span class="sample-minutes">25<small>00</small></span></span><span>分钟主角</span></span></label></div></fieldset>

              <label class="encouragement-option"><input type="checkbox" name="encouragement" checked>专注时偶尔鼓励我</label><p class="settings-note">每完成 4 次专注，可选择长休息。<br>修改时长会重置当前计时。</p>
            </div>
            <div class="settings-actions"><button id="settings-cancel" type="button" class="secondary">取消</button><button type="submit" class="primary">保存设置</button></div>
          </form>
        </section>
<div id="mini-beam"><button hidden id="mini" class="mini mini-entry" data-variant="bubble" aria-label="专注25:00，收起控制"><span id="mini-label" class="entry-label">专注</span><span id="mini-time" class="entry-time">25:00</span></button></div>
<div hidden id="encouragement" role="status" aria-live="polite"></div>
<aside id="reminder" class="reminder reminder-card" aria-labelledby="reminder-title" hidden>
            <button id="dismiss-reminder" class="icon-button reminder-close" aria-label="收起完成提醒"><svg><use href="#i-close"/></svg></button><span class="success-mark"><svg><use href="#i-check"/></svg></span><h2 id="reminder-title">这一段，完成了。</h2><p id="message-feedback" class="message-feedback" role="alert" hidden></p><p id="reminder-copy">专注了 25 分钟，歇一会儿吧。</p><div class="reminder-actions"><button id="rest-now" class="primary">休息 5 分钟</button><button id="five-more" class="secondary">再专注 5 分钟</button></div>
