<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Codex 剩余额度</title>
    <link rel="stylesheet" href="quota-label.css">
    <link rel="stylesheet" href="color-mode.css">
  </head>
  <body>
    <div id="quota-beam">
      <section id="quota-label" data-state="disconnected" data-size="standard" data-expanded="false" data-severity="normal" data-has-items="false" data-item-count="0" aria-label="Codex 剩余额度">
        <p id="status" role="status" aria-live="polite">Codex 未连接</p>
        <p id="summary" aria-hidden="true"></p>
        <div id="compact-header" aria-hidden="true">
          <div class="compact-product">
            <span id="compact-product">CODEX</span>
            <span id="compact-period" class="period-pill">周额度</span>
          </div>
          <span class="compact-collapse">⌃</span>
        </div>
        <ul id="items"></ul>
        <div id="quota-details" aria-label="额度重置详情">
          <p id="reset-time"></p>
          <p id="reset-credits"></p>
        </div>
        <div id="secondary-quota" aria-label="另一周期额度">
          <div class="secondary-heading">
            <span id="secondary-period" class="period-pill">周额度</span>
            <span id="secondary-value">--%</span>
          </div>
          <progress id="secondary-progress" max="100" value="0"></progress>
          <p id="secondary-reset"></p>
        </div>
        <div id="extra-credits" aria-label="Pro 额外点数余额">
          <span class="credits-label">额外点数</span>
          <span class="credits-value"><span id="credits-balance"></span><span id="credits-unit">点</span></span>
        </div>
      <p id="overflow"></p>
      <div id="codex-expanded" aria-label="Codex 额度与状态"></div>
      <div id="quota-numbers" aria-label="剩余额度"></div>
      </section>
    </div>
    <button id="quota-guard-entry" type="button" aria-label="进入球球守护战" title="球球守护战" hidden>
      <span id="guard-entry-pet" class="guard-entry-pet" aria-hidden="true"></span>
      <span id="guard-entry-zombie" class="guard-entry-zombie" aria-hidden="true"><canvas width="87" height="124"></canvas><svg viewBox="0 0 87 94"></svg></span>
    </button>
    <script src="color-mode.js"></script>
    <script src="credit-balance.js"></script>
    <script src="quota-effects.js"></script>
    <script src="quota-card-motion.js"></script><script src="quota-label-renderer.js"></script>
    <script src="../emotion-ball/js/rings.js"></script>
    <script src="../emotion-ball/js/ball.js"></script>
    <script src="assets/quota-guard/zombie-data.js"></script>
    <script src="quota-guard-renderer.js"></script>
  </body>
</html>
